name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Load signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the permanent MS Launcher key"
          else
            echo "::warning::KEYSTORE_B64 secret not set - APK is signed with a temporary key and cannot update an existing install"
          fi

      - name: Build release APKs (standard + lock editions)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleStandardRelease assembleLockRelease --no-daemon

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Security gate (permissions, debuggable, backup, services, network, signature)
        run: |
          bash .github/security-check.sh \
            app/build/outputs/apk/standard/release/app-standard-release.apk \
            app/build/outputs/apk/lock/release/app-lock-release.apk

      - name: Upload standard edition (recommended)
        uses: actions/upload-artifact@v4
        with:
          name: MSLauncher-standard-apk
          path: app/build/outputs/apk/standard/release/*.apk

      - name: Upload lock edition (adds double-tap to lock)
        uses: actions/upload-artifact@v4
        with:
          name: MSLauncher-lock-apk
          path: app/build/outputs/apk/lock/release/*.apk
